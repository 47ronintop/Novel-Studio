name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Verify file identity runtime contract
        run: npm run runtime:check

      - name: Install dependencies
        run: npm ci

      - name: Changed-file formatting (full-format debt retained locally)
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD_SHA: ${{ github.sha }}
        run: npm run format:changed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm run test

      - name: Electron E2E smoke
        run: npm run test:e2e:built

      - name: Package preflight
        run: npm run package:verify

      - name: Release channel check
        run: npm run release:check

      - name: Alpha gate
        run: npm run alpha:verify

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Package Node build inputs
        run: npm run package:dir:built
