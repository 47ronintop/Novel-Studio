name: Engineering File Access Native

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/engineering-file-access-native.yml"
      - "native/engineering-file-access-win32/**"
      - "apps/desktop/electron-builder.config.cjs"
      - "apps/desktop/src/main/engineering-file-access-qualification.ts"
      - "apps/desktop/test/engineering-file-access-package.e2e.ts"
      - "apps/desktop/test/engineering-file-access-probe-contract.test.ts"
      - "apps/desktop/test/engineering-file-access-production-evidence.test.ts"
      - "scripts/build-engineering-file-access-win32.mjs"
      - "scripts/compose-engineering-file-access-production-evidence.mjs"
      - "scripts/package-check.mjs"
      - "scripts/sign-engineering-file-access-win32.mjs"
      - "scripts/probe-engineering-file-access-disabled-protections-win32.mjs"
      - "scripts/probe-engineering-file-access-package.mjs"

jobs:
  build-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify clean checkout and remove stale native outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trackedChanges = @(git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $trackedChanges.Count -ne 0) {
            throw "Native qualification requires a clean tracked checkout"
          }
          $nativeRoot = (Resolve-Path "native/engineering-file-access-win32").Path
          foreach ($relativePath in @(".build", "dist")) {
            $target = Join-Path $nativeRoot $relativePath
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Verify file identity runtime contract
        run: npm run runtime:check
      - name: Install Node-API headers and generate import library (no native toolchain install)
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts node-api-headers@1.9.0
          $include = Join-Path (Resolve-Path "node_modules/node-api-headers") "include"
          if (-not (Test-Path (Join-Path $include "node_api.h"))) { throw "Node-API headers are unavailable" }
          $ErrorActionPreference = "Stop"
          $nodeApiDef = Join-Path (Resolve-Path "node_modules/node-api-headers") "def/node_api.def"
          if (-not (Test-Path -LiteralPath $nodeApiDef -PathType Leaf)) { throw "Node-API export definition is unavailable" }
          $nodeLibrary = Join-Path $env:RUNNER_TEMP "node_api_x64.lib"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "Visual Studio discovery tool is unavailable" }
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $vsVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion).Trim()
          $vsDevCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
          if ([string]::IsNullOrWhiteSpace($vsRoot) -or [string]::IsNullOrWhiteSpace($vsVersion) -or -not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "Visual Studio C++ tools are unavailable"
          }
          # Do not ask CMake to rediscover a registered Visual Studio instance.  The hosted
          # image exposes the C++ toolset through VsDevCmd, and CMake's bundled Ninja can use
          # that already-qualified environment directly.
          $ninja = (Get-Command ninja.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $ninja) {
            $bundledNinja = Join-Path $vsRoot "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe"
            if (Test-Path -LiteralPath $bundledNinja -PathType Leaf) {
              $ninja = $bundledNinja
            }
          }
          if (-not $ninja) { throw "Ninja is unavailable from the discovered Visual Studio toolchain" }
          $command = 'call "{0}" -no_logo -host_arch=x64 -arch=x64 && lib.exe /nologo /machine:X64 /def:"{1}" /out:"{2}"' -f $vsDevCmd, $nodeApiDef, $nodeLibrary
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $nodeLibrary -PathType Leaf)) {
            throw "Node-API import-library generation failed"
          }
          "NODE_API_INCLUDE_DIR=$include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NODE_LIBRARY=$nodeLibrary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ENGINEERING_FILE_ACCESS_VSDEVCMD=$vsDevCmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ENGINEERING_FILE_ACCESS_VS_VERSION=$vsVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ENGINEERING_FILE_ACCESS_CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_MAKE_PROGRAM=$ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build the canonical addon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logPath = Join-Path $env:RUNNER_TEMP "engineering-file-access-build.log"
          node scripts/build-engineering-file-access-win32.mjs 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $detail = (Get-Content -LiteralPath $logPath -Tail 40) -join "`n"
            $escaped = $detail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Native addon build failed::$escaped"
            exit $exitCode
          }
      - name: Verify the addon carries its MSVC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $addon = (Resolve-Path "native/engineering-file-access-win32/dist/win32-x64/engineering_file_access.node").Path
          $command = 'call "{0}" -no_logo -host_arch=x64 -arch=x64 >nul && dumpbin.exe /nologo /dependents "{1}"' -f $env:ENGINEERING_FILE_ACCESS_VSDEVCMD, $addon
          $dependencies = cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect native addon dependencies" }
          $dynamicCrt = $dependencies | Select-String -Pattern '(?i)\b(?:MSVCP\d*|VCRUNTIME\d*(?:_\d*)?|api-ms-win-crt-[^\s]+)\.dll\b'
          if ($dynamicCrt) {
            throw "Native addon must carry its MSVC runtime instead of requiring a runner-installed redistributable: $($dynamicCrt.Line -join ', ')"
          }
      - name: Verify canonical source and toolchain identity in the same manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = "native/engineering-file-access-win32/dist/win32-x64/engineering_file_access.manifest.json"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          foreach ($path in @(
            "native/engineering-file-access-win32/CMakeLists.txt",
            "native/engineering-file-access-win32/src/engineering_file_access.cc"
          )) {
            $declared = @($manifest.sourceIdentity.files | Where-Object { $_.path -eq $path })
            if ($declared.Count -ne 1) { throw "Manifest must declare exactly one source identity for $path" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($declared[0].sha256 -ne $actual) { throw "Manifest source identity mismatch for $path" }
          }
          if (
            $manifest.sourceIdentity.sha256 -notmatch "^[a-f0-9]{64}$" -or
            $manifest.toolchain.sha256 -notmatch "^[a-f0-9]{64}$" -or
            $manifest.buildIdentity.sha256 -notmatch "^[a-f0-9]{64}$" -or
            $manifest.developmentMutationV2Probe.sourceIdentitySha256 -ne $manifest.sourceIdentity.sha256 -or
            $manifest.developmentMutationV2Probe.toolchainIdentitySha256 -ne $manifest.toolchain.sha256 -or
            $manifest.developmentMutationV2Probe.productCapability -ne "unavailable" -or
            $manifest.developmentMutationV2Probe.primitives.stateDurability -ne "available" -or
            $manifest.developmentMutationV2Probe.lifecyclePrimitives.move -ne "available" -or
            $manifest.developmentMutationV2Probe.lifecyclePrimitives.caseOnlyTwoStepWal -ne "available" -or
            $manifest.developmentMutationV2Probe.lifecyclePrimitives.volumeLocalRecoveryRoot -ne "available" -or
            $manifest.developmentMutationV2Probe.lifecyclePrimitives.quarantineDelete -ne "available" -or
            $manifest.developmentMutationV2Probe.lifecyclePrimitives.restoreNoOverwrite -ne "available" -or
            $manifest.developmentMutationV2Probe.lifecyclePrimitives.localPurge -ne "available" -or
            $manifest.developmentMutationV2Probe.lifecyclePrimitives.singleLevelCreateDirectory -ne "available" -or
            $manifest.eligibility.batch -ne "6" -or
            $manifest.eligibility.mutation -ne "unavailable" -or
            $manifest.eligibility.recovery -ne "unavailable"
          ) { throw "Manifest does not preserve the single-chain B6 product / B8 development identity boundary" }
      - name: Record unsigned development positive, negative, and fault probe result
        run: node scripts/probe-engineering-file-access-package.mjs
      - name: Verify B8 probe evidence is complete and diagnostic only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content -Raw -LiteralPath native/engineering-file-access-win32/dist/win32-x64/engineering_file_access.probe.json | ConvertFrom-Json
          $mutation = $report.mutationV2Probe
          $state = $report.stateDurabilityProbe
          if ($report.productionQualified -ne $false -or $report.reason -ne "unsigned_development_artifact" -or $mutation.status -ne "passed" -or $state.status -ne "passed") {
            throw "Native development probe must remain diagnostic and unsigned"
          }
          foreach ($name in @(
            "noFollowDirectory",
            "exclusiveWriteAndFlush",
            "createOnlyHardLinkInstall",
            "atomicReplaceRename",
            "noFollowReadAndList",
            "unlinkAndDirectoryFlush"
          )) {
            if ($state.$name -ne "passed") { throw "Missing state durability probe: $name" }
          }
          foreach ($name in @(
            "rawByteCandidateBefore",
            "absenceProof",
            "absenceProofV2",
            "objectMutationAbi",
            "targetInspection",
            "operationStateReconciliation",
            "handleRelativeRevalidation",
            "finalRenameNamespaceRevalidation",
            "handleBoundReplaceHandoff",
            "hardLinkRejection",
            "copyOnReplaceSafety",
            "fixedCreateMetadata",
            "receiptDurability",
            "stagingWalRecoveryScan",
            "recoveryBeforeCleanup",
            "lifecycleCreateDirectory",
            "lifecycleMove",
            "lifecycleCaseOnlyMove",
            "lifecycleQuarantine",
            "lifecycleRestore",
            "lifecyclePurge"
          )) {
            if ($mutation.$name -ne "passed") { throw "Missing positive mutation probe: $name" }
          }
          foreach ($name in @(
            "rawByteManifestMismatch",
            "walBindingMismatch",
            "hardLinkLeaf",
            "staleAbsenceProof",
            "v2RawByteManifestMismatch",
            "v2StaleAbsenceProof",
            "replaceFinalRenameNamespaceRevalidation",
            "targetSwapFinalWindowNoOverwrite",
            "createOnlyHandoffCollisionRecoveryRequired"
          )) {
            if ($mutation.negativeCanaries.$name -ne "canary_exposed") { throw "Missing negative mutation canary: $name" }
          }
          if (
            $mutation.faultProbe.nativeExport -ne "passed" -or
            $mutation.faultProbe.orphanStagingRecoveryRequired -ne "canary_exposed" -or
            $mutation.faultProbe.replaceFinalRenameNamespaceRevalidation -ne "canary_exposed" -or
            $mutation.faultProbe.afterOriginalHandoffRecoveryRequired -ne "canary_exposed" -or
            $mutation.faultProbe.beforeCandidateHandoffRecoveryRequired -ne "canary_exposed" -or
            $mutation.faultProbe.afterCandidateHandoffRecoveryRequired -ne "canary_exposed"
          ) {
            throw "Missing native fault-probe evidence"
          }
      - name: Execute compile-time disabled-protection controls
        run: node scripts/probe-engineering-file-access-disabled-protections-win32.mjs
      - name: Compose and reverify strict unsigned production evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRoot = (Resolve-Path ".").Path
          $dist = (Resolve-Path "native/engineering-file-access-win32/dist/win32-x64").Path
          $canaryBuild = (Resolve-Path "native/engineering-file-access-win32/.build/disabled-protection-canaries-win32-x64").Path
          $evidence = Join-Path $env:RUNNER_TEMP "engineering-file-access.production-evidence.json"
          node scripts/compose-engineering-file-access-production-evidence.mjs `
            --source-root $sourceRoot `
            --artifact (Join-Path $dist "engineering_file_access.node") `
            --manifest (Join-Path $dist "engineering_file_access.manifest.json") `
            --signature (Join-Path $dist "engineering_file_access.manifest.p7s") `
            --development-report (Join-Path $dist "engineering_file_access.probe.json") `
            --disabled-protection-report (Join-Path $canaryBuild "engineering_file_access.disabled-protection-canaries.json") `
            --out $evidence
      - name: Record addon SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath native/engineering-file-access-win32/dist/win32-x64/engineering_file_access.node).Hash.ToLowerInvariant()
          "$hash  engineering_file_access.node" | Set-Content -NoNewline -Encoding ascii native/engineering-file-access-win32/dist/win32-x64/engineering_file_access.sha256
      - name: Upload native candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-file-access-win32
          path: native/engineering-file-access-win32/dist/win32-x64/
          if-no-files-found: error
      - name: Upload disabled-protection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-file-access-win32-disabled-protection-diagnostics
          path: |
            native/engineering-file-access-win32/.build/disabled-protection-canaries-win32-x64/*.node
            native/engineering-file-access-win32/.build/disabled-protection-canaries-win32-x64/*.json
            ${{ runner.temp }}/engineering-file-access.production-evidence.json
          if-no-files-found: warn
